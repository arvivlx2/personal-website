<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffcf00">
<title>Brick Sorter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e3;--ink:#1d1d1b;--mut:#6b6658;--yel:#ffcf00;--red:#e3000b;--blue:#006cb7;--grn:#00a651;--line:#eadfc4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 120px}
h1,h2{margin:0;font-weight:900}
small{color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=password]{font:inherit;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:none}
input:focus{border-color:var(--blue)}
a{color:var(--blue);font-weight:800}
.top{display:flex;gap:12px;align-items:center;margin:4px 0 16px}
.top h1{font-size:26px}.top p{margin:2px 0 0;color:var(--mut);font-weight:700;font-size:14px}
.top .gear{margin-left:auto;background:#fff;border:2px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:20px}
.logo{width:48px;height:48px;flex:none}
.back{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;margin-bottom:12px}
.banner{background:#fff1c2;border:2px solid #f2d36b;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px;line-height:1.4}
.banner.err{background:#ffe3e1;border-color:#f3a59f}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 0 var(--line),0 6px 18px rgba(80,60,0,.07);padding:14px;margin-bottom:12px}
.setcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.thumb{width:68px;height:68px;border-radius:14px;flex:none;object-fit:contain;background:#fff8df;display:grid;place-items:center;font-weight:900;font-size:13px;overflow:hidden}
.grow{flex:1;min-width:0}
.ttl{font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#eef3ff;color:var(--blue);margin-left:4px;vertical-align:middle}
.badge.other{background:#f3eefc;color:#6b3fb3}
.bar{height:12px;background:#f1ead8;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#2b9cf0);border-radius:99px;transition:width .3s}
.bar.done i{background:var(--grn)}
.pct{font-weight:800;font-size:13px;color:var(--mut)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;justify-content:center;z-index:5}
.bottom .btn{flex:1;max-width:340px}
.btn{border-radius:16px;padding:14px 16px;font-weight:900;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);display:block;text-align:center;position:relative;overflow:hidden}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.yellow{background:var(--yel)}.red{background:var(--red);color:#fff}.blue{background:var(--blue);color:#fff}.ghost{background:#fff;border:2px solid var(--line);box-shadow:none}
.full{width:100%}
.btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.empty{text-align:center;padding:26px 14px;color:var(--mut);font-weight:700;line-height:1.45}
.empty b{display:block;font-size:20px;color:var(--ink);margin:8px 0 6px}
.big{font-size:40px;font-weight:900;line-height:1}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #f1ead8}
.row:last-child{border-bottom:0}
.row.done{opacity:.5}
.pimg{width:44px;height:44px;object-fit:contain;flex:none;background:#fafafa;border-radius:8px}
.sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.2);display:inline-block;vertical-align:-2px;margin-right:4px}
.pi{flex:1;min-width:0}.pi b{display:block;font-size:14px;line-height:1.25}
.pi small{font-size:12px}
.ct{display:flex;align-items:center;gap:5px;font-weight:900;font-variant-numeric:tabular-nums}
.ct button{width:34px;height:34px;border-radius:10px;background:#f1ead8;font-size:20px;font-weight:900;line-height:1}
.ct span{min-width:42px;text-align:center;font-size:14px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;padding:10px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:800}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lbl{font-weight:900;font-size:15px;margin:16px 0 8px;display:block}
.hint{font-size:13px;color:var(--mut);font-weight:600;line-height:1.45}
.toggle{display:flex;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.toggle button{flex:1;padding:10px;border-radius:10px;background:transparent;font-weight:800}
.toggle button.on{background:var(--yel)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-weight:800;margin:18px 0}
.or:before,.or:after{content:"";flex:1;height:2px;background:var(--line)}
.status{display:flex;gap:10px;align-items:center;font-weight:800;padding:12px;background:#eef6ff;border-radius:14px;margin-top:12px;color:#0b4f86;line-height:1.35}
.status.err{background:#ffe3e1;color:#9b1209}
.status.ok{background:#dff5e8;color:#0b7a3e}
.spin{width:20px;height:20px;border:3px solid #bcdcff;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:7px 11px;border-radius:99px;background:#f4efe0;border:2px solid transparent;font-weight:800;font-size:13px;text-align:left}
.chip.on{background:var(--yel);border-color:#d9ae00}
.chip.full{color:var(--mut)}
.chip.maybe{background:#f6f3ff}
.chip.maybe.on{background:var(--yel)}
.chip.skip.on{background:#e8e3d4;border-color:#bdb59e}
.res{padding:12px 0;border-bottom:1px solid #f1ead8}
.res:last-child{border-bottom:0}
.rh{display:flex;gap:10px;align-items:flex-start}
.crops{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.crops img{width:46px;height:46px;object-fit:cover;border-radius:8px;border:2px solid #f1ead8}
.conf{font-size:11px;font-weight:900;padding:2px 7px;border-radius:99px;flex:none}
.c-high{background:#dff5e8;color:#0b7a3e}.c-medium{background:#fff1c2;color:#8a6500}.c-low{background:#ffe3e1;color:#9b1209}
.decide{display:inline-block;margin-top:6px;font-size:12px;font-weight:900;color:#6b3fb3;background:#f3eefc;padding:3px 8px;border-radius:99px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:#fff;border-radius:14px;padding:10px 4px;border:2px solid var(--line)}
.sum b{display:block;font-size:24px;font-weight:900}
.sum span{font-size:12px;font-weight:800;color:var(--mut)}
details summary{font-weight:900;cursor:pointer;padding:6px 0}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#000;touch-action:manipulation}
.stage img{display:block;width:100%}
.box{position:absolute;border:3px solid var(--yel);border-radius:6px;background:rgba(255,207,0,.12)}
.box.off{border-color:rgba(255,255,255,.5);border-style:dashed;background:rgba(0,0,0,.35)}
.box span{position:absolute;top:-2px;left:-2px;background:var(--yel);color:#000;font-size:11px;font-weight:900;padding:0 4px;border-radius:0 0 6px 0}
.box.off span{background:#ccc}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:30;padding:20px}
#modal.show{display:grid}
#modal .card{max-width:380px;width:100%}
.mrow{display:flex;gap:8px;margin-top:14px}.mrow .btn{flex:1}
.complete{color:var(--grn);font-weight:900}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.links button{background:none;color:var(--mut);font-weight:800;font-size:13px;text-decoration:underline;padding:4px}
.sugg{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:12px;background:#f9f5ea;margin-top:6px}
.sugg img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px}
ol.steps{padding-left:20px;margin:6px 0;line-height:1.55;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<script>
"use strict";
/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
const uid = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const BRICKOGNIZE = "https://api.brickognize.com";
const RB = "https://rebrickable.com/api/v3/lego";
const LOGO = `<svg class="logo" viewBox="0 0 48 48"><rect x="2" y="9" width="44" height="34" rx="7" fill="#b80009"/><rect x="2" y="9" width="44" height="28" rx="7" fill="#e3000b"/><circle cx="15" cy="20" r="6" fill="#ff4a3f" stroke="#b80009" stroke-width="2"/><circle cx="33" cy="20" r="6" fill="#ff4a3f" stroke="#b80009" stroke-width="2"/></svg>`;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3000); }
function confirmBox(msg, ok, cb) {
  const m = $("#modal");
  m.innerHTML = `<div class="card"><div style="font-weight:800;font-size:16px">${esc(msg)}</div><div class="mrow"><button class="btn ghost" id="mNo">Cancel</button><button class="btn red" id="mOk">${esc(ok)}</button></div></div>`;
  m.classList.add("show");
  $("#mNo").onclick = () => m.classList.remove("show");
  $("#mOk").onclick = () => { m.classList.remove("show"); cb(); };
}

/* ===== storage (IndexedDB, falls back to memory) ===== */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("brick-sorter", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  return {
    async get(k) { try { const db = await open(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch { return undefined; } },
    async set(k, v) { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
  };
})();
let saveT = null;
function saveAll() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => { try { await store.set("sets", S.sets); } catch (e) { toast("Couldn't save on this phone: " + e.message); } }, 300);
}

/* ===== state ===== */
const S = { sets: {}, key: "", colors: null, view: "home", cur: null, filter: "", missingOnly: true, add: null, scan: null };
const prog = s => { let need = 0, found = 0; for (const p of s.parts) { need += p.q; found += Math.min(p.f || 0, p.q); } return { need, found, pct: need ? Math.floor(found * 100 / need) : 0 }; };

/* ===== Rebrickable ===== */
async function rb(path, params = {}) {
  if (!S.key) throw new Error("Add your free Rebrickable key in Settings (⚙️) first.");
  const u = new URL(RB + path);
  u.searchParams.set("key", S.key);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  let r;
  try { r = await fetch(u); } catch { throw new Error("Couldn't reach Rebrickable — check your internet connection."); }
  if (r.status === 401 || r.status === 403) throw new Error("Rebrickable rejected the key. Check it in Settings (⚙️).");
  if (r.status === 404) throw new Error("NOTFOUND");
  if (r.status === 429) { await sleep(1500); return rb(path, params); }
  if (!r.ok) throw new Error("Rebrickable error " + r.status);
  return r.json();
}
async function rbAll(path, params = {}) {
  let out = [], page = 1;
  for (;;) {
    const d = await rb(path, Object.assign({ page_size: 1000, page }, params));
    out = out.concat(d.results || []);
    if (!d.next) return out;
    page++; await sleep(1100); // Rebrickable allows ~1 call/second
  }
}
async function loadColors() {
  if (S.colors) return S.colors;
  const cached = await store.get("colors");
  if (cached && cached.t > Date.now() - 30 * 864e5) return (S.colors = cached.m);
  const list = await rbAll("/colors/");
  const m = {};
  for (const c of list) {
    const bl = c.external_ids?.BrickLink || {};
    m[c.id] = { name: c.name, rgb: c.rgb, tr: !!c.is_trans, blIds: (bl.ext_ids || []).map(String), blNames: (bl.ext_descrs || []).flat().map(String) };
  }
  await store.set("colors", { t: Date.now(), m });
  return (S.colors = m);
}
function partFrom(pr, colors, mult = 1) {
  const p = pr.part, c = pr.color, cm = colors[c.id] || {};
  return {
    p: p.part_num, n: p.name, img: p.part_img_url || "",
    bl: (p.external_ids?.BrickLink || []).map(String),
    c: c.name, cid: c.id, rgb: c.rgb || cm.rgb || "cccccc", tr: !!(c.is_trans ?? cm.tr),
    blc: cm.blIds || [], blcn: cm.blNames || [],
    q: pr.quantity * mult, f: 0
  };
}
function mergeParts(arr) {
  const m = new Map();
  for (const x of arr) { const k = x.p + "|" + x.cid; if (m.has(k)) m.get(k).q += x.q; else m.set(k, x); }
  return [...m.values()];
}
async function fetchSet(num, onMsg) {
  let n = String(num).trim().replace(/\s+/g, "");
  if (!/-\d+$/.test(n)) n += "-1";
  onMsg("Looking up set " + n + "…");
  let info;
  try { info = await rb(`/sets/${encodeURIComponent(n)}/`); }
  catch (e) { if (e.message === "NOTFOUND") throw new Error(`Rebrickable doesn't know set “${num}”. Check the number on the box.`); throw e; }
  const colors = await loadColors();
  onMsg(`Downloading parts list for ${info.name}…`);
  const rows = await rbAll(`/sets/${encodeURIComponent(n)}/parts/`, { inc_part_details: 1, inc_color_details: 1 });
  let parts = rows.filter(r => !r.is_spare).map(r => partFrom(r, colors));
  // minifigure parts
  try {
    const figs = await rbAll(`/sets/${encodeURIComponent(n)}/minifigs/`);
    for (const f of figs) {
      onMsg(`Adding minifigure parts (${f.set_name || f.set_num})…`);
      await sleep(1100);
      const fp = await rbAll(`/minifigs/${encodeURIComponent(f.set_num)}/parts/`, { inc_part_details: 1 });
      parts = parts.concat(fp.filter(r => !r.is_spare).map(r => partFrom(r, colors, f.quantity || 1)));
    }
  } catch { /* minifigs optional */ }
  return { number: info.set_num, name: info.name, year: info.year, img: info.set_img_url || "", parts: mergeParts(parts) };
}

/* ===== Brickognize ===== */
async function brickognize(endpoint, blob) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const fd = new FormData(); fd.append("query_image", blob, "image.jpg");
    let r;
    try { r = await fetch(BRICKOGNIZE + endpoint, { method: "POST", body: fd }); }
    catch { throw new Error("Couldn't reach Brickognize — check your internet connection."); }
    if (r.status === 429 || r.status === 503) { await sleep(1500 * (attempt + 1)); continue; }
    if (!r.ok) throw new Error("Brickognize error " + r.status);
    return r.json();
  }
  throw new Error("Brickognize is busy — try again in a minute.");
}

/* ===== images & pile segmentation ===== */
async function loadImage(file) {
  let img;
  try { img = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Couldn't read that photo")); i.src = URL.createObjectURL(file); }); }
  const max = 2000, sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const toBlob = (c, q = 0.88) => new Promise(r => c.toBlob(r, "image/jpeg", q));

function segment(full) {
  const W = 480, sc = W / full.width, H = Math.round(full.height * sc);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"); ctx.drawImage(full, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  // background = median of border pixels
  const bw = Math.max(3, Math.round(Math.min(W, H) * 0.04)), rs = [], gs = [], bs = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    if (x < bw || y < bw || x >= W - bw || y >= H - bw) { const i = (y * W + x) * 4; rs.push(d[i]); gs.push(d[i + 1]); bs.push(d[i + 2]); }
  }
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  const br = med(rs), bg = med(gs), bb = med(bs);
  const bl = (br + bg + bb) / 3;
  const dist = new Float32Array(W * H);
  for (let p = 0, i = 0; p < W * H; p++, i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2], l = (r + g + b) / 3;
    // chroma difference counts fully; pure darkening (shadows) counts less
    const cr = (r - l) - (br - bl), cg = (g - l) - (bg - bl), cb = (b - l) - (bb - bl);
    const chroma = Math.sqrt(cr * cr + cg * cg + cb * cb);
    const dl = l - bl, light = dl < 0 ? -dl * 0.55 : dl;
    dist[p] = Math.max(chroma * 1.4, light);
  }
  // threshold from border noise
  const bd = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (x < bw || y < bw || x >= W - bw || y >= H - bw) bd.push(dist[y * W + x]);
  bd.sort((p, q) => p - q);
  const T = Math.max(26, bd[Math.floor(bd.length * 0.95)] + 14);
  let m = new Uint8Array(W * H);
  for (let p = 0; p < W * H; p++) m[p] = dist[p] > T ? 1 : 0;
  const morph = (src, r, dilate) => {
    const out = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let v = dilate ? 0 : 1;
      for (let dy = -r; dy <= r && (dilate ? !v : v); dy++) for (let dx = -r; dx <= r; dx++) {
        const yy = y + dy, xx = x + dx;
        const s = yy < 0 || xx < 0 || yy >= H || xx >= W ? 0 : src[yy * W + xx];
        if (dilate && s) { v = 1; break; } if (!dilate && !s) { v = 0; break; }
      }
      out[y * W + x] = v;
    }
    return out;
  };
  m = morph(morph(m, 1, false), 1, true);   // remove specks
  m = morph(m, 2, true);                     // join a piece's pieces (studs, highlights)
  // connected components
  const lab = new Int32Array(W * H), boxes = [], stack = [];
  for (let p = 0; p < W * H; p++) {
    if (!m[p] || lab[p]) continue;
    let x0 = W, y0 = H, x1 = 0, y1 = 0, area = 0; lab[p] = 1; stack.push(p);
    while (stack.length) {
      const q = stack.pop(), x = q % W, y = (q / W) | 0; area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && m[q - 1] && !lab[q - 1]) { lab[q - 1] = 1; stack.push(q - 1); }
      if (x < W - 1 && m[q + 1] && !lab[q + 1]) { lab[q + 1] = 1; stack.push(q + 1); }
      if (y > 0 && m[q - W] && !lab[q - W]) { lab[q - W] = 1; stack.push(q - W); }
      if (y < H - 1 && m[q + W] && !lab[q + W]) { lab[q + W] = 1; stack.push(q + W); }
    }
    boxes.push({ x0, y0, x1, y1, area });
  }
  const minA = W * H * 0.0006, maxSide = 0.8;
  let bx = boxes.filter(b => b.area >= minA && (b.x1 - b.x0) < W * maxSide && (b.y1 - b.y0) < H * maxSide);

      const a = bx[i], b = bx[j];
      const ix = Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)), iy = Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
      const inter = ix * iy, sa = (a.x1 - a.x0) * (a.y1 - a.y0), sb = (b.x1 - b.x0) * (b.y1 - b.y0);
      if (inter > 0.5 * Math.min(sa, sb)) {
        bx[i] = { x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1), area: a.area + b.area };
        bx.splice(j, 1); merged = true; break outer;

    }

  return bx.map(b => ({ x: b.x0 / W, y: b.y0 / H, w: (b.x1 - b.x0 + 1) / W, h: (b.y1 - b.y0 + 1) / H, on: true }))

}
async function cropBox(full, b) {
  const pad = 0.18, W = full.width, H = full.height;

  const side = Math.max(w, h, 80); x -= (side - w) / 2; y -= (side - h) / 2; w = h = side;
  x = Math.max(0, x); y = Math.max(0, y); w = Math.min(W - x, w); h = Math.min(H - y, h);
  const out = Math.min(640, Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(out * w / Math.max(w, h)); c.height = Math.round(out * h / Math.max(w, h));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(full, x, y, w, h, 0, 0, c.width, c.height);

  t.width = Math.round(c.width * ts); t.height = Math.round(c.height * ts); t.getContext("2d").drawImage(c, 0, 0, t.width, t.height);
  return { blob: await toBlob(c), thumb: t.toDataURL("image/jpeg", 0.7) };
}

/* ===== matching ===== */
function buildIndex(setIds) {
  const idx = new Map();
  const add = (k, ref) => { k = String(k).toLowerCase(); if (!idx.has(k)) idx.set(k, []); idx.get(k).push(ref); };
  for (const id of setIds) {
    const s = S.sets[id]; if (!s) continue;
    s.parts.forEach((p, i) => { const ref = { id, i }; add(p.p, ref); for (const b of p.bl || []) if (b !== p.p) add(b, ref); });
  }
  return idx;
}
function lookup(idx, partId) {
  const k = String(partId).toLowerCase();
  let r = idx.get(k);
  if (!r) { const base = k.replace(/[a-z]$/, ""); if (base !== k) r = idx.get(base); }
  return r ? [...new Map(r.map(x => [x.id + ":" + x.i, x])).values()] : [];
}
function colorMatches(p, colors) {
  if (!colors || !colors.length) return null;
  const names = [norm(p.c), ...(p.blcn || []).map(norm)], ids = (p.blc || []).map(String);
  return colors.slice(0, 2).some(c => names.includes(norm(c.name)) || ids.includes(String(c.id)));
}
function analysePiece(res, idx) {
  const items = (res.items || []).filter(it => it.type === "part" || !it.type).slice(0, 4);
  const colors = (res.colors || []).filter(c => (c.score ?? 1) >= 0.15);
  const top = items[0];
  const out = { name: top ? top.name : "Unknown piece", partId: top ? top.id : "", img: top ? top.img_url : "", score: top ? top.score : 0, color: colors[0]?.name || "", options: [] };
  for (let rank = 0; rank < items.length; rank++) {
    const it = items[rank];
    if (rank > 0 && it.score < 0.15) break;
    const refs = lookup(idx, it.id);
    if (!refs.length) continue;
    const withColor = refs.filter(r => colorMatches(S.sets[r.id].parts[r.i], colors));
    const use = withColor.length ? withColor : refs;
    for (const r of use) out.options.push({ id: r.id, i: r.i, rank, colorOk: withColor.length > 0, name: it.name });
    out.name = it.name; out.partId = it.id; out.img = it.img_url; out.score = it.score;
    break; // first (best) candidate that is in one of the sets
  }
  out.conf = out.score >= 0.75 ? "high" : out.score >= 0.45 ? "medium" : "low";
  return out;
}

/* ===== actions ===== */
function setAddMsg(msg, busy, err) { S.add.msg = msg; S.add.busy = !!busy; S.add.err = !!err; render(); }
async function addSetByNumber(num) {
  if (!num.trim()) { setAddMsg("Type the set number from the box.", false, true); return; }
  setAddMsg("Looking up the set…", true);
  try {
    const set = await fetchSet(num, m => { S.add.msg = m; const el = $("#addMsg"); if (el) el.textContent = m; });
    const dup = Object.values(S.sets).find(s => s.number === set.number);
    if (dup) { setAddMsg(`“${set.name}” is already in your list.`, false, true); return; }
    const id = uid();
    S.sets[id] = Object.assign({ id, created: Date.now(), owned: S.add.owned }, set);
    saveAll(); S.cur = id; S.filter = ""; S.missingOnly = true; S.add = null; go("set");
    toast(`Added ${set.name} — ${prog(S.sets[id]).need} pieces`);
  } catch (e) { setAddMsg(e.message, false, true); }
}
async function recogniseBox(file) {
  setAddMsg("Recognising the set from your photo…", true);
  try {
    const c = await loadImage(file);
    const c2 = document.createElement("canvas"), sc = Math.min(1, 1200 / Math.max(c.width, c.height));
    c2.width = c.width * sc; c2.height = c.height * sc; c2.getContext("2d").drawImage(c, 0, 0, c2.width, c2.height);
    const r = await brickognize("/predict/sets/", await toBlob(c2));
    const items = (r.items || []).slice(0, 4);
    if (!items.length) { setAddMsg("Couldn't recognise a set in that photo. Try the set number instead.", false, true); return; }
    S.add.sugg = items; S.add.msg = ""; S.add.busy = false; render();
  } catch (e) { setAddMsg(e.message, false, true); }
}
async function loadPile(file) {
  const C = S.scan;
  C.busy = true; C.err = false; C.msg = "Finding the pieces in your photo…"; C.img = null; render();
  try {
    const full = await loadImage(file);
    await sleep(30);
    C.full = full;
    C.boxes = segment(full);
    const prev = document.createElement("canvas"), sc = Math.min(1, 1000 / Math.max(full.width, full.height));
    prev.width = full.width * sc; prev.height = full.height * sc; prev.getContext("2d").drawImage(full, 0, 0, prev.width, prev.height);
    C.img = prev.toDataURL("image/jpeg", 0.8);
    if (!C.boxes.length) C.boxes = [{ x: 0, y: 0, w: 1, h: 1, on: true }];
    C.busy = false; C.msg = C.boxes.length === 1 && C.boxes[0].w === 1 ? "Couldn't separate pieces — I'll treat the whole photo as one piece." : "";
    render();
  } catch (e) { C.busy = false; C.err = true; C.msg = e.message; render(); }
}
async function identify() {
  const C = S.scan, boxes = C.boxes.filter(b => b.on);
  C.busy = true; C.err = false; C.msg = `Identifying piece 1 of ${boxes.length}…`; render();
  const idx = buildIndex([...C.only]);
  const results = new Array(boxes.length); let done = 0, failed = 0, lastErr = "";
  const work = async (k) => {
    const crop = await cropBox(C.full, boxes[k]);
    try {
      const r = await brickognize("/predict/parts/?predict_color=true", crop.blob);
      results[k] = Object.assign(analysePiece(r, idx), { thumb: crop.thumb });
    } catch (e) { failed++; lastErr = e.message; results[k] = null; }
    done++; const el = $("#scanMsg"); if (el) el.textContent = `Identifying pieces… ${done} of ${boxes.length}`;
  };
  let next = 0;
  await Promise.all([0, 1, 2].map(async () => { while (next < boxes.length) { const k = next++; await work(k); } }));
  if (failed === boxes.length) { C.busy = false; C.err = true; C.msg = lastErr || "Recognition failed."; render(); return; }
  // group identical pieces
  const groups = new Map();
  for (const r of results) {
    if (!r) continue;
    const key = r.options.length ? r.options.map(o => o.id + ":" + o.i).join(",") : "u:" + r.partId + ":" + r.color;
    if (groups.has(key)) { const g = groups.get(key); g.count++; g.thumbs.push(r.thumb); if (r.score > g.score) Object.assign(g, { score: r.score, conf: r.conf }); }
    else groups.set(key, Object.assign(r, { count: 1, thumbs: [r.thumb] }));
  }
  const R = [...groups.values()];
  for (const r of R) {
    const needOpts = r.options.map((o, oi) => oi).filter(oi => { const o = r.options[oi], p = S.sets[o.id].parts[o.i]; return p.q - (p.f || 0) > 0; });
    r.choice = !r.options.length || !needOpts.length ? "skip" : needOpts.length === 1 ? needOpts[0] : null;
  }
  R.sort((a, b) => (b.options.length > 0) - (a.options.length > 0) || (a.choice === null ? -1 : 0) - (b.choice === null ? -1 : 0) || b.count - a.count);
  C.results = R; C.busy = false; C.msg = failed ? `${failed} piece(s) couldn't be checked.` : ""; C.applied = "";
  render(); window.scrollTo(0, 0);
  if (failed) toast(`${failed} piece(s) couldn't be checked`);
}
function applyScan() {
  const C = S.scan, touched = new Set(); let added = 0, extra = 0;
  for (const r of C.results) {
    if (r.choice == null || r.choice === "skip") continue;
    const o = r.options[r.choice]; const s = S.sets[o.id]; if (!s) continue;
    const p = s.parts[o.i], n = Math.min(Math.max(0, p.q - (p.f || 0)), r.count);
    p.f = (p.f || 0) + n; added += n; extra += r.count - n; touched.add(o.id);
  }
  saveAll();
  C.applied = `Added ${added} piece${added === 1 ? "" : "s"} to ${[...touched].map(id => S.sets[id].name).join(" and ")}${extra ? ` (${extra} extra — those parts were already full)` : ""}.`;
  render(); window.scrollTo(0, 0);
}
function exportBackup() {
  const blob = new Blob([JSON.stringify({ app: "brick-sorter", v: 1, sets: S.sets }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `brick-sorter-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
}
async function importBackup(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== "brick-sorter" || typeof d.sets !== "object") throw new Error("That isn't a Brick Sorter backup.");
    confirmBox(`Replace your sets with the ${Object.keys(d.sets).length} sets in this backup?`, "Restore", () => { S.sets = d.sets; saveAll(); go("home"); toast("Backup restored"); });
  } catch (e) { toast(e.message); }
}

/* ===== events ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  if (b.tagName === "A") e.preventDefault();
  const a = b.dataset.a, s = S.sets[S.cur];
  switch (a) {
    case "home": S.scan = null; S.add = null; go("home"); break;
    case "settings": go("settings"); break;
    case "saveKey": S.key = $("#keyIn").value.trim(); store.set("key", S.key); toast(S.key ? "Key saved" : "Key removed"); go("home"); break;
    case "export": exportBackup(); break;
    case "open": S.cur = b.dataset.id; S.filter = ""; S.missingOnly = true; go("set"); break;
    case "add": S.add = { num: "", owned: true, msg: "", busy: false, sugg: null }; go("add"); break;
    case "fetchSet": addSetByNumber(S.add.num); break;
    case "pickSugg": S.add.num = b.dataset.n; addSetByNumber(b.dataset.n); break;
    case "addOwned": S.add.owned = b.dataset.v === "1"; render(); break;
    case "scan": S.scan = { only: new Set(Object.keys(S.sets)), boxes: [], img: null, results: null, msg: "" }; go("scan"); break;
    case "scanNew": S.scan.results = null; S.scan.img = null; S.scan.boxes = []; S.scan.msg = ""; S.scan.applied = ""; go("scan"); break;
    case "scanSet": { const id = b.dataset.id; S.scan.only.has(id) ? S.scan.only.delete(id) : S.scan.only.add(id); render(); break; }
    case "tbox": { const bx = S.scan.boxes[+b.dataset.i]; bx.on = !bx.on; render(); break; }
    case "identify": identify(); break;
    case "pick": { const r = S.scan.results[+b.dataset.r]; r.choice = b.dataset.o === "skip" ? "skip" : +b.dataset.o; render(); break; }
    case "apply": applyScan(); break;
    case "inc": case "dec": { const p = s.parts[+b.dataset.i]; p.f = Math.max(0, Math.min(p.q, (p.f || 0) + (a === "inc" ? 1 : -1))); render(); saveAll(); break; }
    case "miss": S.missingOnly = b.dataset.v === "1"; render(); break;
    case "owned": s.owned = s.owned === false; render(); saveAll(); break;
    case "reset": confirmBox(`Reset all found counts for “${s.name}”?`, "Reset", () => { s.parts.forEach(p => p.f = 0); render(); saveAll(); }); break;
    case "del": confirmBox(`Delete “${s.name}” and its progress?`, "Delete", () => { delete S.sets[S.cur]; saveAll(); go("home"); toast("Set deleted"); }); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "numIn") S.add.num = e.target.value;
  if (e.target.id === "q") { S.filter = e.target.value; const s = S.sets[S.cur]; if (s) $("#list").innerHTML = listHTML(s); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "numIn") addSetByNumber(S.add.num); });
document.addEventListener("change", e => {
  const t = e.target, f = t.files && t.files[0]; if (!f) return;
  if (t.id === "pileIn") loadPile(f);
  if (t.id === "boxIn") recogniseBox(f);
  if (t.id === "importIn") importBackup(f);
  t.value = "";
});

/* ===== boot ===== */
(async () => {
  S.sets = (await store.get("sets")) || {};
  S.key = (await store.get("key")) || "";
  render();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
render();
</script>
</body>
